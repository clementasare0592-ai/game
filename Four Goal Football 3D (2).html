<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four Goal Football 3D</title>
<style>
:root{--bg:#0d1218;--fg:#fff;--panel:rgba(13,18,24,.72);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1218;--fg:#fff}}
:root[data-theme="dark"]{--bg:#0d1218;--fg:#fff}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden;touch-action:none}
#c,#c canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:96%}
.s{background:var(--panel);padding:6px 12px;border-radius:8px;font-weight:bold;font-size:15px;display:flex;gap:7px;align-items:center}
.s i{width:12px;height:12px;border-radius:50%;background:var(--c)}
#msg{position:fixed;top:38%;left:0;right:0;text-align:center;font-size:clamp(28px,7vw,64px);font-weight:900;text-shadow:0 3px 12px #000;pointer-events:none}
#help{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--panel);padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.5}
#help button{margin-top:4px;padding:5px 12px;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
#barW{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:min(260px,50%);height:12px;transform:translateX(-50%);background:var(--panel);border-radius:6px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#ffd21c,#e53935)}
#joy,#shot{display:none;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4)}
#joy{left:24px;width:120px;height:120px}#joy b{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
#shot{right:24px;width:96px;height:96px;align-items:center;justify-content:center;font-weight:bold}
#stW{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:min(260px,50%);height:8px;transform:translateX(-50%);background:var(--panel);border-radius:5px;overflow:hidden}
#st{height:100%;width:100%;background:#4ade80}
#slideBtn,#sprintBtn{display:none;position:fixed;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);align-items:center;justify-content:center;font-weight:bold;font-size:20px}
#slideBtn{right:130px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}#sprintBtn{right:34px;bottom:calc(env(safe-area-inset-bottom,0px) + 132px)}
@media (pointer:coarse){#joy{display:block}#shot{display:flex}#slideBtn,#sprintBtn{display:flex}#help{display:none}}
</style>
</head>
<body>
<div id="c"></div>
<div id="hud"></div>
<div id="msg"></div>
<div id="help">Move: WASD / Arrows<br>Hold SPACE to charge, release to shoot<br>E: slide tackle &nbsp; T (hold): sprint<br>First to 5 goals wins<br><button onclick="reset(true)">Restart match</button></div>
<div id="barW"><div id="bar"></div></div>
<div id="stW"><div id="st"></div></div><div id="slideBtn">E</div><div id="sprintBtn">T</div>
<div id="joy"><b></b></div><div id="shot">SHOOT</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,W=55,H=30,GW=6,WIN=5;
const wrap=document.getElementById('c');
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
wrap.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x0d1218);scene.fog=new T.Fog(0x0d1218,130,280);
const cam=new T.PerspectiveCamera(48,1,1,400);let camS=1;
scene.add(new T.HemisphereLight(0xffffff,0x335533,.8));
const sun=new T.DirectionalLight(0xffffff,.8);sun.position.set(-30,70,30);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-75,right:75,top:50,bottom:-50,near:10,far:200});scene.add(sun);
const std=(c,r=.6,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});

/* ---------- pitch ---------- */
(function(){
  const c=document.createElement('canvas');c.width=1800;c.height=1050;const g=c.getContext('2d');
  for(let i=0;i<24;i++){g.fillStyle=i%2?'#3f8f37':'#489a3f';g.fillRect(i*75,0,75,1050)}
  g.translate(900,525);g.scale(15,15);g.strokeStyle='#fff';g.lineWidth=.3;
  g.strokeRect(-W,-H,2*W,2*H);g.beginPath();g.arc(0,0,7,0,7);g.stroke();
  g.fillStyle='#fff';g.beginPath();g.arc(0,0,.5,0,7);g.fill();
  [[-12,H-9,24,9],[-12,-H,24,9],[-W,-12,9,24],[W-9,-12,9,24],[-6,H-4,12,4],[-6,-H,12,4],[-W,-6,4,12],[W-4,-6,4,12]].forEach(r=>g.strokeRect(...r));
  const tex=new T.CanvasTexture(c);tex.anisotropy=8;
  const f=new T.Mesh(new T.PlaneGeometry(120,70),new T.MeshStandardMaterial({map:tex,roughness:.9}));
  f.rotation.x=-Math.PI/2;f.receiveShadow=true;scene.add(f);
  const a=new T.Mesh(new T.PlaneGeometry(400,400),std(0x1f3a1c,1));a.rotation.x=-Math.PI/2;a.position.y=-.03;scene.add(a);
})();

/* ---------- boards, stands, crowd ---------- */
let crowdFn=()=>{},cheer=0;
const boardMat=std(0x1b2733,.5);
function box(w,h,d,x,y,z,m){const b=new T.Mesh(new T.BoxGeometry(w,h,d),m);b.position.set(x,y,z);b.castShadow=b.receiveShadow=true;scene.add(b);return b}
[-1,1].forEach(s=>{
  box(W-GW,1.1,.5,s*(W+GW)/2,.55,-H-.4,boardMat);box(W-GW,1.1,.5,s*(W+GW)/2,.55,H+.4,boardMat);
  box(.5,1.1,H-GW,-W-.4,.55,s*(H+GW)/2,boardMat);box(.5,1.1,H-GW,W+.4,.55,s*(H+GW)/2,boardMat);
});
(function(){
  const rows=7,dummy=new T.Object3D(),spots=[];
  for(let side=0;side<4;side++){
    const horiz=side<2,sg=side%2?1:-1,len=horiz?62:36;
    for(let r=0;r<rows;r++){
      const dist=(horiz?H:W)+9+r*2.2,y=r*1.5;
      const st=new T.Mesh(new T.BoxGeometry(horiz?len*2:2.2,y+1,horiz?2.2:len*2),std(0x2a3441,.9));
      st.position.set(horiz?0:sg*dist,(y+1)/2-.5,horiz?sg*dist:0);scene.add(st);
      for(let t=-len;t<len;t+=1.7)spots.push([horiz?t:sg*dist,y+1.4,horiz?sg*dist:t,side]);
    }
  }
  const N=spots.length,body=new T.InstancedMesh(new T.CylinderGeometry(.42,.5,1.2,8),std(0xffffff,.8),N);
  const head=new T.InstancedMesh(new T.SphereGeometry(.34,10,8),std(0xffffff,.7),N);
  const arms=new T.InstancedMesh(new T.BoxGeometry(.17,.95,.17),std(0xffffff,.7),N*2);
  const team=[0xffd21c,0xe53935,0x1e7bff,0x16a34a],mix=[0xffffff,0xffd21c,0xe53935,0x1e7bff,0x16a34a,0x222b36];
  const skins=[0xf1c8a5,0xd9a07a,0xb67c55,0x8d5a3b,0x5e3a24],ph=[];
  spots.forEach((s,i)=>{
    ph.push(Math.random()*6.28);
    body.setColorAt(i,new T.Color(Math.random()<.75?team[s[3]]:mix[(Math.random()*mix.length)|0]));
    const sk=new T.Color(skins[(Math.random()*skins.length)|0]);head.setColorAt(i,sk);arms.setColorAt(i*2,sk);arms.setColorAt(i*2+1,sk);
  });
  scene.add(body,head,arms);
  const set=(m,i,x,y,z,rz)=>{dummy.position.set(x,y,z);dummy.rotation.set(0,0,rz);dummy.updateMatrix();m.setMatrixAt(i,dummy.matrix)};
  crowdFn=t=>{
    const up=cheer>0,amp=up?.8:.1,sp=up?8:2.2;
    for(let i=0;i<N;i++){
      const s=spots[i],h=Math.abs(Math.sin(t*sp+ph[i]))*amp*(.6+(ph[i]%1)*.8),y=s[1]+h;
      set(body,i,s[0],y,s[2],0);set(head,i,s[0],y+.95,s[2],0);
      const lift=up?.55:0,tilt=up?.45:.05;
      set(arms,i*2,s[0]-.58,y+.3+lift,s[2],tilt);set(arms,i*2+1,s[0]+.58,y+.3+lift,s[2],-tilt);
    }
    body.instanceMatrix.needsUpdate=head.instanceMatrix.needsUpdate=arms.instanceMatrix.needsUpdate=true;
  };
})();

/* ---------- game data ---------- */
const hex=c=>'#'+c.toString(16).padStart(6,'0');
const defs=[
 {n:'YOU',col:0xe53935,c:[0,H],inw:[0,-1],lat:[1,0],rot:0,start:[0,H-10],score:0},
 {n:'YELLOW',col:0xffd21c,c:[0,-H],inw:[0,1],lat:[1,0],rot:Math.PI,start:[0,-H+10],score:0},
 {n:'BLUE',col:0x1e7bff,c:[-W,0],inw:[1,0],lat:[0,1],rot:-Math.PI/2,start:[-W+26,0],score:0},
 {n:'GREEN',col:0x16a34a,c:[W,0],inw:[-1,0],lat:[0,1],rot:Math.PI/2,start:[W-26,0],score:0}];

/* ---------- 3D goals ---------- */
function makeGoal(g){
  const grp=new T.Group(),hh=4.2,d=4,white=std(0xffffff,.35,.3),team=std(g.col,.4,.2);
  const cyl=(r,h,m,x,y,z)=>{const c=new T.Mesh(new T.CylinderGeometry(r,r,h,12),m);c.position.set(x,y,z);c.castShadow=true;grp.add(c);return c};
  [-GW,GW].forEach(x=>{cyl(.22,hh,white,x,hh/2,0);cyl(.16,hh,white,x,hh/2,d)});
  cyl(.22,2*GW,team,0,hh,0).rotation.z=Math.PI/2;cyl(.16,2*GW,white,0,hh,d).rotation.z=Math.PI/2;
  [-GW,GW].forEach(x=>{const b=cyl(.16,d,white,x,hh,d/2);b.rotation.x=Math.PI/2});
  const net=new T.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.4});
  const pl=(w,h,sw,sh,x,y,z,rx,ry)=>{const p=new T.Mesh(new T.PlaneGeometry(w,h,sw,sh),net);p.position.set(x,y,z);p.rotation.set(rx,ry,0);grp.add(p)};
  pl(2*GW,hh,12,6,0,hh/2,d,0,0);pl(d,hh,4,6,-GW,hh/2,d/2,0,Math.PI/2);pl(d,hh,4,6,GW,hh/2,d/2,0,Math.PI/2);pl(2*GW,d,12,4,0,hh,d/2,-Math.PI/2,0);
  grp.position.set(g.c[0],0,g.c[1]);grp.rotation.y=g.rot;scene.add(grp);
}
defs.forEach(makeGoal);

/* ---------- 3D players ---------- */
function makePlayer(col,human){
  const g=new T.Group(),kit=std(col,.55),skin=std(0xd9a07a,.7),dark=std(0x1a1a1a,.6),sock=std(col,.7);
  const mk=(geo,mat,x,y,z,par=g)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;par.add(m);return m};
  const torso=mk(new T.CylinderGeometry(.78,.62,1.45,14),kit,0,2.4,0);
  mk(new T.BoxGeometry(1.2,.5,.8),dark,0,1.6,0);
  const head=mk(new T.SphereGeometry(.46,16,12),skin,0,3.45,0);
  mk(new T.SphereGeometry(.49,14,8,0,6.3,0,1.35),dark,0,3.5,-.03);
  const leg=x=>{const p=new T.Group();p.position.set(x,1.55,0);g.add(p);
    mk(new T.CylinderGeometry(.24,.21,.8,10),skin,0,-.4,0,p);mk(new T.CylinderGeometry(.22,.2,.7,10),sock,0,-1.15,0,p);mk(new T.BoxGeometry(.42,.25,.75),dark,0,-1.5,.15,p);return p};
  const arm=x=>{const p=new T.Group();p.position.set(x,2.95,0);g.add(p);mk(new T.CylinderGeometry(.19,.16,1.25,10),skin,0,-.6,0,p);return p};
  const o={g,torso,head,legL:leg(-.35),legR:leg(.35),armL:arm(-.98),armR:arm(.98)};
  const ring=new T.Mesh(new T.RingGeometry(1.5,human?2.1:1.8,32),new T.MeshBasicMaterial({color:human?0xffffff:col,side:T.DoubleSide,transparent:true,opacity:.9}));
  ring.rotation.x=-Math.PI/2;ring.position.y=.06;g.add(ring);
  if(human){o.arrow=new T.Mesh(new T.ConeGeometry(.55,1,4),new T.MeshBasicMaterial({color:0xffffff}));o.arrow.rotation.x=Math.PI;g.add(o.arrow)}
  scene.add(g);return o;
}
const P=defs.map((d,i)=>({def:d,m:makePlayer(d.col,i===0),human:i===0,x:0,z:0,vx:0,vz:0,ang:0,cool:0,kick:0,phase:0,ownT:0,tg:null,tgT:0,err:0,slide:0,slideCD:0,stun:0,hit:false,sprint:false}));

/* ---------- ball ---------- */
const ball={x:0,z:0,vx:0,vz:0,owner:null,last:null};
(function(){
  const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,256,128);g.fillStyle='#161616';
  for(let y=0;y<4;y++)for(let x=0;x<8;x++){g.beginPath();g.arc(x*32+16+(y%2)*16,y*32+16,10,0,7);g.fill()}
  ball.mesh=new T.Mesh(new T.SphereGeometry(.6,24,16),new T.MeshStandardMaterial({map:new T.CanvasTexture(c),roughness:.4}));
  ball.mesh.castShadow=true;ball.mesh.position.y=.6;scene.add(ball.mesh);
})();

/* ---------- HUD ---------- */
const hudEl=document.getElementById('hud'),msgEl=document.getElementById('msg'),bar=document.getElementById('bar');
function hud(){hudEl.innerHTML=defs.map(d=>`<span class="s" style="--c:${hex(d.col)}"><i></i>${d.n} ${d.score}</span>`).join('')}
let freeze=0,over=false,charge=0,charging=false,stam=1,lock=false,sprintHeld=false;const stEl=document.getElementById('st');
function reset(full){
  if(full){defs.forEach(d=>d.score=0);over=false}
  P.forEach(p=>{p.x=p.def.start[0];p.z=p.def.start[1];p.vx=p.vz=0;p.ang=Math.atan2(p.def.inw[0],p.def.inw[1]);p.cool=p.kick=p.ownT=0;p.tg=null});
  Object.assign(ball,{x:0,z:0,vx:0,vz:0,owner:null,last:null});freeze=0;msgEl.textContent='';hud();
}

/* ---------- input ---------- */
const keys={};let joy={x:0,z:0};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k===' '||k.startsWith('arrow'))e.preventDefault();
  if(k==='r'){reset(true);return}if(k==='e')startSlide(P[0]);if(k===' '&&!keys[' '])charging=true;keys[k]=true});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;if(k===' ')release()});
function release(){if(charging){charging=false;humanShoot(12+28*Math.max(.12,charge))}charge=0}
const joyEl=document.getElementById('joy'),knob=joyEl.firstElementChild;
function joyMove(e){const r=joyEl.getBoundingClientRect(),x=(e.clientX-r.left-60)/50,z=(e.clientY-r.top-60)/50,m=Math.max(1,Math.hypot(x,z));
  joy={x:x/m,z:z/m};knob.style.transform=`translate(${joy.x*30}px,${joy.z*30}px)`}
joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);joyMove(e)});
joyEl.addEventListener('pointermove',e=>{if(e.buttons)joyMove(e)});
joyEl.addEventListener('pointerup',()=>{joy={x:0,z:0};knob.style.transform=''});
document.getElementById('slideBtn').addEventListener('pointerdown',()=>startSlide(P[0]));
const spB=document.getElementById('sprintBtn');spB.addEventListener('pointerdown',()=>sprintHeld=true);['pointerup','pointercancel','pointerleave'].forEach(e=>spB.addEventListener(e,()=>sprintHeld=false));
const shotEl=document.getElementById('shot');
shotEl.addEventListener('pointerdown',()=>{charging=true});shotEl.addEventListener('pointerup',release);

/* ---------- physics ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function stepPlayer(p,dx,dz,dt,maxV,acc){
  let m=Math.hypot(dx,dz);if(m>1){dx/=m;dz/=m;m=1}
  let turn=0;
  if(m>.1){let da=Math.atan2(dx,dz)-p.ang;da=Math.atan2(Math.sin(da),Math.cos(da));turn=Math.abs(da)/Math.PI;p.ang+=da*Math.min(1,dt*9)}
  const v=maxV*(1-.35*turn)*(ball.owner===p?.92:1)*(p.sprint?(p.human?1.35:1.2):1),a=Math.min(1,(m>.05?acc:acc*1.7)*dt);
  p.vx+=(dx*v-p.vx)*a;p.vz+=(dz*v-p.vz)*a;
  p.x=clamp(p.x+p.vx*dt,-W+1.2,W-1.2);p.z=clamp(p.z+p.vz*dt,-H+1.2,H-1.2);
}
function kick(p,power,dx,dz){
  ball.x=p.x+dx*1.3;ball.z=p.z+dz*1.3;ball.vx=dx*power;ball.vz=dz*power;
  if(ball.owner===p)ball.owner=null;ball.last=p;p.cool=.45;p.kick=.25;P.forEach(q=>q.err=(Math.random()-.5)*5);
}
function humanShoot(power){const p=P[0];
  if(p.cool<=0&&Math.hypot(p.x-ball.x,p.z-ball.z)<2.8)kick(p,power,Math.sin(p.ang),Math.cos(p.ang));else p.kick=.2}
function possession(){
  let best=null,bd=2.4;
  for(const p of P){if(p.cool>0)continue;const d=Math.hypot(p.x-ball.x,p.z-ball.z);if(d<bd){bd=d;best=p}}
  if(!best||best===ball.owner)return;
  if(!ball.owner&&Math.hypot(ball.vx,ball.vz)>24)return;
  const o=ball.owner;
  if(!o||bd<Math.hypot(o.x-ball.x,o.z-ball.z)-.05){if(o)o.cool=.7;ball.owner=best;best.ownT=0;best.tg=null}
}
function ballStep(dt){
  const o=ball.owner;
  if(o){
    const sp=Math.hypot(o.vx,o.vz),off=1.2+.7*Math.max(0,Math.sin(o.phase*2))*Math.min(1,sp/6);
    const tx=o.x+Math.sin(o.ang)*off,tz=o.z+Math.cos(o.ang)*off,f=Math.min(1,dt*14);
    ball.vx+=(o.vx+(tx-ball.x)*9-ball.vx)*f;ball.vz+=(o.vz+(tz-ball.z)*9-ball.vz)*f;ball.last=o;
    if(Math.hypot(ball.x-o.x,ball.z-o.z)>2.8)ball.owner=null;
  }else{const dm=Math.exp(-.8*dt);ball.vx*=dm;ball.vz*=dm}
  ball.x+=ball.vx*dt;ball.z+=ball.vz*dt;
  if(Math.abs(ball.x)>W&&Math.abs(ball.z)>=GW-.3){ball.x=Math.sign(ball.x)*W;ball.vx*=-.7}
  if(Math.abs(ball.z)>H&&Math.abs(ball.x)>=GW-.3){ball.z=Math.sign(ball.z)*H;ball.vz*=-.7}
  for(const g of defs){
    const rx=ball.x-g.c[0],rz=ball.z-g.c[1],dep=-(rx*g.inw[0]+rz*g.inw[1]),lat=rx*g.lat[0]+rz*g.lat[1];
    if(dep>.3&&Math.abs(lat)<GW-.3){goalScored(g);return}
  }
  const sp=Math.hypot(ball.vx,ball.vz);
  if(sp>.05)ball.mesh.rotateOnWorldAxis(new T.Vector3(ball.vz,0,-ball.vx).normalize(),sp*dt/.6);
}
function goalScored(g){
  const s=ball.last;ball.vx=ball.vz=0;ball.owner=null;freeze=1.8;cheer=3;
  if(s&&s.def!==g){s.def.score++;msgEl.textContent='GOAL! '+s.def.n;msgEl.style.color=hex(s.def.col);
    if(s.def.score>=WIN){over=true;freeze=1e9;msgEl.textContent=s.def.n+' WINS! Press R'}}
  else{msgEl.textContent='OWN GOAL';msgEl.style.color='#fff'}
  hud();
}

function startSlide(p){if(p.slide>0||p.slideCD>0||p.stun>0||ball.owner===p||freeze>0)return;p.slide=.5;p.slideCD=1.4;p.hit=false;p.vx=Math.sin(p.ang)*16;p.vz=Math.cos(p.ang)*16}
function slideStep(p,dt){
  if(p.slide>0){
    p.slide-=dt;const k=Math.exp(-2.5*dt);p.vx*=k;p.vz*=k;
    p.x=clamp(p.x+p.vx*dt,-W+1.2,W-1.2);p.z=clamp(p.z+p.vz*dt,-H+1.2,H-1.2);
    if(!p.hit&&Math.hypot(p.x-ball.x,p.z-ball.z)<2.7){p.hit=true;const o=ball.owner;if(o&&o!==p)o.cool=.8;ball.owner=p;p.ownT=0;p.tg=null;ball.last=p}
    if(p.slide<=0)p.stun=.35;return true}
  if(p.stun>0){p.stun-=dt;const k=Math.exp(-8*dt);p.vx*=k;p.vz*=k;p.x+=p.vx*dt;p.z+=p.vz*dt;return true}
  return false}
/* ---------- AI ---------- */
function ai(p,dt,nearest){
  const g=p.def,[cx,cz]=g.c,[ix,iz]=g.inw,[lx,lz]=g.lat;
  const rx=ball.x-cx,rz=ball.z-cz,bi=rx*ix+rz*iz,lat=rx*lx+rz*lz,vi=ball.vx*ix+ball.vz*iz,vl=ball.vx*lx+ball.vz*lz;
  let tx,tz,v=9.6;
  if(ball.owner===p){
    p.ownT+=dt;p.tgT-=dt;
    if(!p.tg||p.tgT<=0){
      let best=-1e9;
      for(const q of P){if(q===p)continue;const e=q.def,qd=Math.hypot(q.x-e.c[0],q.z-e.c[1]),sc=qd-.3*Math.hypot(p.x-e.c[0],p.z-e.c[1])+Math.random()*8+(q.human?0:7);
        if(sc>best){best=sc;const ql=(q.x-e.c[0])*e.lat[0]+(q.z-e.c[1])*e.lat[1],off=ql>0?-3.2:3.2;p.tg=[e.c[0]+e.lat[0]*off,e.c[1]+e.lat[1]*off];p.tgc=e.c}}
      p.tgT=1.5;
    }
    tx=p.tg[0];tz=p.tg[1];v=8.8;
    const ax=tx-p.x,az=tz-p.z,d=Math.hypot(ax,az)||1,dg=Math.hypot(p.x-p.tgc[0],p.z-p.tgc[1]),al=(Math.sin(p.ang)*ax+Math.cos(p.ang)*az)/d;
    if(p.ownT>.25&&((dg<30&&al>.9)||dg<14)){
      const e=(Math.random()-.5)*.1,c=Math.cos(e),s=Math.sin(e),nx=ax/d,nz=az/d;
      kick(p,clamp(16+dg,18,36),nx*c-nz*s,nx*s+nz*c);
    }
  }else if(vi<-9&&bi<34&&!ball.owner){
    const t=Math.max(0,(bi-2.5)/-vi),l=clamp(lat+vl*t+p.err,-GW+.5,GW-.5);
    tx=cx+ix*2.5+lx*l;tz=cz+iz*2.5+lz*l;v=11;
  }else if(Math.hypot(rx,rz)<34||nearest===p){
    tx=ball.x+ball.vx*.25;tz=ball.z+ball.vz*.25;
  }else{
    const l=clamp(lat,-GW+1,GW-1),dp=clamp(3+bi*.12,3,7);
    tx=cx+ix*dp+lx*l;tz=cz+iz*dp+lz*l;
  }
  let dx=tx-p.x,dz=tz-p.z;const d=Math.hypot(dx,dz);p.sprint=d>10;
  const ow=ball.owner;if(ow&&ow!==p&&p.slideCD<=0&&Math.hypot(ow.x-p.x,ow.z-p.z)<3.4&&Math.random()<.03){p.ang=Math.atan2(ball.x-p.x,ball.z-p.z);startSlide(p)}
  if(d<.4)dx=dz=0;else{const m=Math.min(1,d/2.5);dx=dx/d*m;dz=dz/d*m}
  stepPlayer(p,dx,dz,dt,v,14);
}

/* ---------- loop ---------- */
function update(dt){
  let nearest=null,nd=1e9;
  for(const p of P){if(p.human)continue;const d=Math.hypot(p.x-ball.x,p.z-ball.z);if(d<nd){nd=d;nearest=p}}
  for(const p of P){
    p.cool-=dt;p.kick-=dt;p.slideCD-=dt;if(slideStep(p,dt))continue;
    if(p.human){
      let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.z;
      const want=(keys.t||sprintHeld)&&(dx||dz);
      if(want&&!lock){stam=Math.max(0,stam-.3*dt);if(stam<=0)lock=true}else{stam=Math.min(1,stam+.2*dt);if(stam>.3)lock=false}
      p.sprint=!!want&&!lock;stEl.style.width=stam*100+'%';
      stepPlayer(p,dx,dz,dt,10.5,16);
    }else ai(p,dt,nearest);
  }
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){
    const a=P[i],b=P[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
    if(d<2.2&&d>0){const k=(2.2-d)/2/d;a.x-=dx*k;a.z-=dz*k;b.x+=dx*k;b.z+=dz*k}
  }
  if(charging)charge=Math.min(1,charge+dt/.7);
  bar.style.width=charge*100+'%';
  possession();ballStep(dt);
}
function animate(dt,t){
  for(const p of P){
    const m=p.m,sp=Math.hypot(p.vx,p.vz),k=Math.min(1,sp/8);
    p.phase+=sp*dt*1.4;
    m.g.position.set(p.x,0,p.z);m.g.rotation.y=p.ang;
    const sw=Math.sin(p.phase*2.2)*.95*k;
    m.legL.rotation.x=sw;m.legR.rotation.x=p.kick>0?-1.5*p.kick/.25:-sw;
    m.armL.rotation.x=-sw*.8;m.armR.rotation.x=sw*.8;m.torso.rotation.x=(p.sprint?.35:.2)*k;
    m.g.rotation.order='YXZ';m.g.rotation.x=p.slide>0?-1.25:(p.stun>0?-1.25*p.stun/.35:0);
    if(p.slide>0){m.legR.rotation.x=-1.5;m.legL.rotation.x=.5;m.armL.rotation.x=m.armR.rotation.x=-2.2}
    if(m.arrow)m.arrow.position.set(0,5+Math.sin(t*5)*.25,0);
  }
  ball.mesh.position.set(ball.x,.6,ball.z);crowdFn(t);
  const cx=ball.x*.25;
  cam.position.set(cx,60*camS,50*camS);cam.lookAt(cx,0,3);
}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();camS=Math.max(1,1.85/cam.aspect)}
addEventListener('resize',resize);resize();reset(true);
let prev=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-prev)/1000);prev=now;
  if(freeze>0){freeze-=dt;if(freeze<=0&&!over)reset(false)}else update(dt);
  cheer=Math.max(0,cheer-dt);animate(dt,now/1000);renderer.render(scene,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
